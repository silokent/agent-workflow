# Model cho từng vai — Orchestrator (Claude) gọi qua `agent-run <vai>`.
# Project muốn đổi riêng: tạo `.agent-workflow/roles.conf` cùng định dạng,
# chỉ cần ghi những dòng muốn thay (dòng trùng tên vai sẽ thắng).
#
# vai            model         effort  sandbox          cờ (phẩy, hoặc -)
#   cờ: net    = cho phép mạng trong sandbox (npm install, gọi API…)
#       search = bật web search
#   artist: mọi việc tạo ảnh (sprite, icon, banner, ảnh minh hoạ, texture…)
planner          gpt-6-astra   high    workspace-write  -
executor         gpt-6.1-sol   xhigh   workspace-write  net
executor-hard    gpt-6-astra   medium  workspace-write  net
researcher       gpt-6.1-sol   high    read-only        search
reviewer         gpt-6.1-sol   high    workspace-write  net
artist           gpt-6.1-sol   high    workspace-write  net
